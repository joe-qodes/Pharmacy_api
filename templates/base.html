<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}MedLink{% endblock %}</title>
</head>
<body>

<nav>
  <a href="{% url 'home' %}">MedLink</a> |
  {% if user.is_authenticated %}
    {% if user.role == 'patient' %}
      <a href="{% url 'search' %}">Search Medications</a> |
    {% endif %}
    <a href="{% url 'dashboard' %}">Dashboard</a> |
    <a href="{% url 'logout' %}">Logout</a>
  {% else %}
    <a href="{% url 'login' %}">Login</a> |
    <a href="{% url 'register_patient' %}">Register</a>
  {% endif %}
</nav>

<hr>

{% if messages %}
  {% for message in messages %}
    <p><strong>{{ message }}</strong></p>
  {% endfor %}
{% endif %}

{% block content %}{% endblock %}

</body>
</html>
